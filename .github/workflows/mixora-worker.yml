name: MIXORA backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:vinext
      - name: Check production build
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('.cloudflare/output/v1/config.json', 'utf8'));
          if (config.buildContext?.mode !== 'production' || config.buildContext?.isPreview !== false)
            throw new Error('Expected non-preview production output');
          NODE

  deploy:
    name: Deploy existing mixora-backend
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mixora-backend.buildwithanie.workers.dev
    permissions:
      contents: read
      actions: read
    concurrency:
      group: mixora-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Require GitHub production reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/environments/production';
          const response = await fetch(url, { headers: {
            Accept: 'application/vnd.github+json',
            Authorization: 'Bearer ' + process.env.GH_TOKEN,
            'X-GitHub-Api-Version': '2022-11-28',
          } });
          if (!response.ok) throw new Error('Cannot inspect production approval gate: HTTP ' + response.status);
          const environment = await response.json();
          if (!environment.protection_rules?.some(
            (rule) => rule.type === 'required_reviewers' && rule.reviewers?.length > 0
          )) throw new Error('Production deployment blocked: configure required reviewers');
          console.log('Required-reviewer gate is configured.');
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:vinext
      - name: Check production build
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('.cloudflare/output/v1/config.json', 'utf8'));
          if (config.buildContext?.mode !== 'production' || config.buildContext?.isPreview !== false)
            throw new Error('Expected non-preview production output');
          NODE
      - name: Require existing Worker and disabled preview URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!/^[a-f0-9]{32}$/i.test(account || '') || !token)
            throw new Error('Cloudflare deployment credential or account ID is missing');
          const url = 'https://api.cloudflare.com/client/v4/accounts/' + account +
            '/workers/scripts/mixora-backend/subdomain';
          const response = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
          if (!response.ok) throw new Error('Existing Worker check failed: HTTP ' + response.status);
          const data = await response.json();
          if (!data.success || data.result?.enabled !== true || data.result?.previews_enabled !== false)
            throw new Error('Existing Worker unavailable or preview URLs enabled');
          console.log('Existing Worker found; preview URLs disabled.');
          NODE
      - name: Deploy prebuilt production output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec cf deploy --prebuilt --mode production --no-provision \
            --tag "git-${GITHUB_SHA:0:12}"
